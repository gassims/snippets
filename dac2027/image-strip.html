<html>
<head>
    <style>
        /* 1. Reset for full-screen slides */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
    
        /* 2. Outer Wrapper (The visible window) */
        .carousel {
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    
        /* 3. The Track (The core of the scroll snapping) */
        .carousel__track {
            display: flex;
            padding: 0;
            margin: 0;
            height: 100%;
            position: relative;
            z-index: 0;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
    
        .carousel__track::-webkit-scrollbar {
            display: none;
        }
    
        /* 4. Individual Slides */
        .carousel__slide {
            flex: 0 0 calc(100% / 3);
            list-style: none;
            scroll-snap-align: start;
        }
    
        @media (max-width: 768px) {
            .carousel__slide {
                flex: 0 0 100%;
            }
        }
    
        .carousel__slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    
        /* 5. Navigation Buttons */
        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgb(0 0 0 / 21%);
            color: white;
            border-radius: 25%;
            border: none;
            padding: 15px;
            cursor: pointer;
            z-index: 999;
            font-size: 3rem;
            transition: background 0.2s ease;
        }
    
        .nav-button:hover {
            background: rgb(0 0 0 / 49%);
        }
    
        .prev {
            left: 10px;
        }
    
        .next {
            right: 10px;
        }
    </style>



</head>

<body>

        <button type="button" class="nav-button prev" aria-label="Previous slide"
            onclick="moveSlide(-1)">&lsaquo;</button>
        <button type="button" class="nav-button next" aria-label="Next slide" onclick="moveSlide(1)">&rsaquo;</button>

            <script>
                const track = document.getElementById('carouselTrack');
                const totalSlides = track.children.length; // 15
                let currentSlideIndex = 0;
                let scrollTimeout;
                let slideWidth = track.children[0]?.offsetWidth || 0;

                function moveSlide(direction) {
                    if (!track.children.length) return;

                    // 1. Recalculate slideWidth, visibleSlides, and maxScrollIndex dynamically on every click
                    slideWidth = track.children[0].offsetWidth;
                    const visibleSlides = Math.max(1, Math.round(track.offsetWidth / slideWidth));
                    const maxScrollIndex = Math.max(0, totalSlides - visibleSlides);

                    let nextIndex = currentSlideIndex + direction;
                    let scrollBehavior = 'smooth';

                    // 2. Check for loop boundary conditions
                    if (nextIndex < 0) {
                        nextIndex = maxScrollIndex;
                        scrollBehavior = 'instant';
                    } else if (nextIndex > maxScrollIndex) {
                        nextIndex = 0;
                        scrollBehavior = 'instant';
                    }

                    // 3. Perform the precise scroll
                    track.scrollTo({
                        left: nextIndex * slideWidth,
                        behavior: scrollBehavior
                    });

                    currentSlideIndex = nextIndex;
                }

                // Initial position setup
                window.addEventListener('load', () => {
                    if (!track.children.length) return;
                    slideWidth = track.children[0].offsetWidth;
                    track.scrollLeft = 0;
                });

                // Realign active slide on window resize
                window.addEventListener('resize', () => {
                    if (!track.children.length) return;
                    slideWidth = track.children[0].offsetWidth;
                    const visibleSlides = Math.max(1, Math.round(track.offsetWidth / slideWidth));
                    const maxScrollIndex = Math.max(0, totalSlides - visibleSlides);

                    currentSlideIndex = Math.min(currentSlideIndex, maxScrollIndex);
                    track.scrollTo({ left: currentSlideIndex * slideWidth, behavior: 'instant' });
                });

                // Sync currentSlideIndex after manual touch/trackpad scrolling
                track.addEventListener('scroll', () => {
                    clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        if (!track.children.length) return;
                        slideWidth = track.children[0].offsetWidth;
                        if (slideWidth > 0) {
                            currentSlideIndex = Math.round(track.scrollLeft / slideWidth);
                        }
                    }, 150);
                });
            </script>
